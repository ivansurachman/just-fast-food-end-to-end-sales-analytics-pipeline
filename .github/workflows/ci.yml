# Continuous integration for the two Python environments of the project.
#
# The pipeline code (`dags/`, `pipelines/`) and the generator have separate pin files, so they run in
# separate jobs: one environment would have to satisfy both, and the two constraint files pin different
# botocore patches. The SeaweedFS tests skip themselves in CI (pipelines/tests/conftest.py skips when
# S3_ACCESS_KEY, S3_SECRET_KEY or the endpoint are missing), which leaves the tests that need no
# containers.
#
# Action versions are pinned to releases older than 14 days (docs/versions.md): checkout v7.0.1
# (2026-07-20) and setup-python v7.1.0 (2026-10-22).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipelines:
    name: pipelines and dags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pipelines/constraints.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q

  generator:
    name: generator
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            generator/constraints.txt
            generator/constraints-dev.txt
      - name: Install
        run: python -m pip install -c constraints.txt -c constraints-dev.txt -e ".[dev,s3test]"
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Types
        run: python -m mypy src tests
