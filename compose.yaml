# Just Fast Food local stack: PostgreSQL, SeaweedFS (S3 API), Airflow 3.
# Memory limits follow the table in docs/pipeline-design.md section 2. Metabase comes later.
#
# Bring up:  podman compose up -d      Tear down: podman compose down
# Values come from .env; copy .env.example first.
name: jff

x-airflow-common: &airflow-common
  image: jff-airflow:3.3.2
  build:
    context: .
    # One build file for both providers. podman-compose 1.6.0 on Windows ignores this key and
    # finds the same Containerfile in the context root; see the header of that file.
    dockerfile: Containerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # FabAuthManager gives a database-backed admin user with the password from .env;
    # the default SimpleAuthManager does not support `airflow users create` in 3.3.2.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in .env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_AIRFLOW_PASSWORD:?set POSTGRES_AIRFLOW_PASSWORD in .env}@postgres:5432/airflow
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    # Read by the generator when a task writes to SeaweedFS.
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    # Handy inside the containers; the generator takes the endpoint as an option.
    JFF_S3_ENDPOINT_INTERNAL: http://seaweedfs:8333
    JFF_S3_ENDPOINT_HOST: http://localhost:8333
  volumes:
    - ./dags:/opt/airflow/dags

services:
  postgres:
    image: docker.io/library/postgres:18.4
    mem_limit: 600m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read by infra/postgres/init/01-databases.sql on first start only.
      POSTGRES_AIRFLOW_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD:?set POSTGRES_AIRFLOW_PASSWORD in .env}
      POSTGRES_METABASE_PASSWORD: ${POSTGRES_METABASE_PASSWORD:?set POSTGRES_METABASE_PASSWORD in .env}
      POSTGRES_ANALYTICS_PASSWORD: ${POSTGRES_ANALYTICS_PASSWORD:?set POSTGRES_ANALYTICS_PASSWORD in .env}
    ports:
      # Loopback only: nothing on the LAN or in WSL needs these, and the host firewall stays shut.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 keeps PGDATA in /var/lib/postgresql/18/docker, so mount the parent.
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.52
    mem_limit: 600m
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs:/etc/seaweedfs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  seaweedfs-init:
    image: docker.io/chrislusf/seaweedfs:4.52
    mem_limit: 256m
    restart: "no"
    entrypoint: ["/bin/sh", "/etc/seaweedfs/create-buckets.sh"]
    environment:
      WEED_MASTER: seaweedfs:9333
      WEED_FILER: seaweedfs:8888
    volumes:
      - ./infra/seaweedfs:/etc/seaweedfs:ro
    depends_on:
      seaweedfs:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    mem_limit: 512m
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/jff/init-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    mem_limit: 800m
    restart: unless-stopped
    # podman-compose 1.6.0 ignores the depends_on completion condition, so the wait script
    # gates every long-running service on the migrated schema.
    entrypoint: ["/opt/jff/wait-for-db.sh"]
    command: ["airflow", "api-server", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/monitor/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    mem_limit: 1700m
    restart: unless-stopped
    entrypoint: ["/opt/jff/wait-for-db.sh"]
    command: ["airflow", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    mem_limit: 500m
    restart: unless-stopped
    entrypoint: ["/opt/jff/wait-for-db.sh"]
    command: ["airflow", "dag-processor"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  seaweedfs_data:
